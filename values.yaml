global:
  baseDomain: null
  authHeaderSecretName: null
  plane:
    mode: unified
    domainPrefix: ''
  podLabels: {}
  tlsSecret: astronomer-tls
  privateCaCerts: []
  privateCaCertsAddToHost:
    enabled: false
    hostDirectory: /etc/docker/certs.d
    addToContainerd: false
    addToDockerd: true
    containerdCertConfigPath: /etc/containerd/certs.d
    containerdHostPath: /etc/containerd
    containerdConfigToml: null
    containerdnodeAffinitys: []
    containerdTolerations: []
    certCopier:
      repository: quay.io/astronomer/ap-base
      tag: 2026.03.24
      pullPolicy: IfNotPresent
    priorityClassName: null
  networkPolicy:
    enabled: true
  airflowOperator:
    enabled: false
  features:
    namespacePools:
      enabled: false
      createRbac: true
      namespaces:
        create: false
        names: []
  namespaceLabels: {}
  namespaceFreeFormEntry: false
  acme: false
  rbacEnabled: true
  podDisruptionBudgetsEnabled: true
  helmRepo: https://helm.astronomer.io
  clusterRoles: true
  istio:
    enabled: false
    rootNamespace: istio-config
  postgresqlEnabled: false
  prometheusPostgresExporterEnabled: false
  manualNamespaceNamesEnabled: false
  nats:
    enabled: true
    replicas: 3
    jetStream:
      enabled: true
      tls: false
  defaultDenyNetworkPolicy: true
  openshiftEnabled: false
  sccEnabled: false
  networkNSLabels: false
  taskUsageMetricsEnabled: false
  deployRollbackEnabled: false
  disableManageClusterScopedResources: false
  enablePerHostIngress: false
  dagOnlyDeployment:
    enabled: false
    repository: quay.io/astronomer/ap-dag-deploy
    tag: 0.9.3
    securityContexts:
      pod:
        fsGroup: 50000
    server:
      readinessProbe: {}
      livenessProbe: {}
      nodeSelector: {}
      affinity: {}
      tolerations: []
    client:
      readinessProbe: {}
      livenessProbe: {}
    resources: {}
    persistence: {}
  logging:
    indexNamePrefix: null
  loggingSidecar:
    enabled: false
    name: sidecar-log-consumer
    repository: quay.io/astronomer/ap-vector
    tag: 0.53.0
    customConfig: false
    indexPattern: null
    extraEnv: []
    securityContext: {}
    readinessProbe: {}
    livenessProbe: {}
    resources: {}
  authSidecar:
    enabled: false
    repository: quay.io/astronomer/ap-auth-sidecar
    tag: 1.29.5
    pullPolicy: IfNotPresent
    port: 8084
    securityContext: {}
    readinessProbe: {}
    livenessProbe: {}
    ingressAllowedNamespaces: []
    default_nginx_settings: 'internal;

      proxy_pass_request_body     off;

      proxy_set_header            Content-Length          "";

      proxy_set_header            X-Forwarded-Proto       "";

      proxy_set_header            X-Original-URL          https://$http_host$request_uri;

      proxy_set_header            X-Original-Method       $request_method;

      proxy_set_header            X-Real-IP               $remote_addr;

      proxy_set_header            X-Forwarded-For         $remote_addr;

      proxy_set_header            X-Auth-Request-Redirect $request_uri;

      proxy_buffering             off;

      proxy_buffer_size           4k;

      proxy_buffers               4 4k;

      proxy_request_buffering     on;

      proxy_http_version          1.1;

      proxy_ssl_server_name       on;

      proxy_pass_request_headers  on;

      client_max_body_size        1024m;

      '
    default_nginx_settings_location: 'auth_request     /auth;

      auth_request_set $auth_status $upstream_status;

      auth_request_set $auth_cookie $upstream_http_set_cookie;

      add_header       Set-Cookie $auth_cookie;

      auth_request_set $authHeader0 $upstream_http_authorization;

      proxy_set_header ''authorization'' $authHeader0;

      auth_request_set $authHeader1 $upstream_http_username;

      proxy_set_header ''username'' $authHeader1;

      auth_request_set $authHeader2 $upstream_http_email;

      proxy_set_header ''email'' $authHeader2;

      error_page 401 = @401_auth_error;

      proxy_set_header Upgrade $http_upgrade;

      proxy_set_header Connection ''connection_upgrade'';

      proxy_set_header X-Real-IP              $remote_addr;

      proxy_set_header X-Forwarded-For        $remote_addr;

      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_cache_bypass $http_upgrade;

      proxy_set_header X-Original-Forwarded-For $http_x_forwarded_for;

      proxy_connect_timeout                   15s;

      proxy_send_timeout                      600s;

      proxy_read_timeout                      600s;

      proxy_buffering                         off;

      proxy_buffer_size                       4k;

      proxy_buffers                           4 4k;

      proxy_max_temp_file_size                1024m;

      proxy_request_buffering                 on;

      proxy_http_version                      1.1;

      proxy_cookie_domain                     off;

      proxy_cookie_path                       off;

      proxy_redirect                          off;

      '
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1024Mi
  customLogging:
    enabled: false
    scheme: https
    host: ''
    port: ''
    secret: ''
    extraEnv: []
  extraAnnotations: {}
  podAnnotations: {}
  azure:
    enabled: false
  platformNodePool:
